name: Upload firmware to Baidu Netdisk

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
    secrets:
      BAIDU_BDUSS:
        required: true
      BAIDU_STOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload without rebuilding
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: baidu-upload-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      BAIDU_UPLOAD_DIR: ${{ vars.BAIDU_UPLOAD_DIR }}
    steps:
      - name: Validate upload destination
        run: |
          echo "BAIDUPCS_GO_CONFIG_DIR=$RUNNER_TEMP/baidupcs-config" >> "$GITHUB_ENV"
          echo "PCS_BIN=$RUNNER_TEMP/baidupcs/BaiduPCS-Go-v4.0.2-linux-amd64/BaiduPCS-Go" >> "$GITHUB_ENV"
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo '::error::Release tag must start with v.'; exit 1 ;;
          esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          case "$BAIDU_UPLOAD_DIR" in
            /*) ;;
            *) echo '::error::Set BAIDU_UPLOAD_DIR to an absolute Netdisk directory, for example /PonWRT-TYFZA1.'; exit 1 ;;
          esac
      - name: Download and verify release firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/baidu-firmware"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern sysupgrade.bin --pattern tyfza1-telnet-install.tar.gz \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/baidu-firmware"
          cd "$RUNNER_TEMP/baidu-firmware"
          sha256sum -c SHA256SUMS
          test -s sysupgrade.bin
          test -s tyfza1-telnet-install.tar.gz
      - name: Install pinned BaiduPCS-Go
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/qjfoidnh/BaiduPCS-Go/releases/download/v4.0.2/BaiduPCS-Go-v4.0.2-linux-amd64.zip \
            --output "$RUNNER_TEMP/baidupcs.zip"
          echo "b5f51388b510433668ca22fa5a1cb8840fb4d9725c5edc830554645010a62339  $RUNNER_TEMP/baidupcs.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/baidupcs.zip" -d "$RUNNER_TEMP/baidupcs"
          chmod 700 "$PCS_BIN"
      - name: Log in to the destination account
        env:
          BAIDU_BDUSS: ${{ secrets.BAIDU_BDUSS }}
          BAIDU_STOKEN: ${{ secrets.BAIDU_STOKEN }}
        run: |
          if [ -z "$BAIDU_BDUSS" ] || [ -z "$BAIDU_STOKEN" ]; then
            echo '::error::Set both BAIDU_BDUSS and BAIDU_STOKEN repository secrets.'
            exit 1
          fi
          umask 077
          mkdir -p "$BAIDUPCS_GO_CONFIG_DIR"
          if ! timeout 90 "$PCS_BIN" login -bduss="$BAIDU_BDUSS" -stoken="$BAIDU_STOKEN" >/dev/null 2>&1; then
            echo '::error::Baidu login failed or timed out; check the account secrets and connectivity.'
            exit 1
          fi
          # This CLI can exit with status 0 even when login fails.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = Path(os.environ['BAIDUPCS_GO_CONFIG_DIR']) / 'pcs_config.json'
          data = json.loads(config.read_text())
          uid = data.get('baidu_active_uid')
          if not uid or not any(user.get('uid') == uid for user in (data.get('baidu_user_list') or [])):
              raise SystemExit('::error::Baidu login did not create an active account; update the account secrets.')
          PY
      - name: Upload installer and sysupgrade firmware
        run: |
          destination="${BAIDU_UPLOAD_DIR%/}/${RELEASE_TAG#v}"
          "$PCS_BIN" upload -policy overwrite -retry 3 -p 2 -l 1 \
            "$RUNNER_TEMP/baidu-firmware/tyfza1-telnet-install.tar.gz" \
            "$RUNNER_TEMP/baidu-firmware/sysupgrade.bin" "$destination"
          printf 'Uploaded installer and sysupgrade firmware to `%s`.\n' "$destination" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove account configuration
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/baidupcs-config"
